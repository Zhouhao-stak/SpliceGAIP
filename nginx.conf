# Nginx Configuration for SpliceGAIP
# Place this file at the project root

events {
    worker_connections 1024;
}

http {
    # Logging
    access_log /var/log/nginx/splicegaip-access.log;
    error_log /var/log/nginx/splicegaip-error.log warn;

    # Upstream definition
    upstream splicegaip_backend {
        server splicegaip-api:8800;
    }

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Main server block
    server {
        listen 80;
        server_name _;

        # Redirect HTTP to HTTPS (if SSL is configured)
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name splicegaip.your-domain.com;  # Change to your domain

        # SSL certificates (managed by Coolify/Let's Encrypt)
        ssl_certificate /etc/ssl/certs/splicegaip.crt;
        ssl_certificate_key /etc/ssl/private/splicegaip.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API endpoints
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://splicegaip_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running analysis
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
        }

        # Streamlit UI
        location / {
            proxy_pass http://splicegaip_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Streamlit
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health check endpoint (no rate limit)
        location /api/health {
            proxy_pass http://splicegaip_backend;
            access_log off;
        }

        # Static files (if any)
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
